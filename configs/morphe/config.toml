[YouTube]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
patcher-args = "-e 'Change header' -Ocustom=configs/morphe/assets/YouTube/header -e 'Custom branding' -OcustomIcon=configs/morphe/assets/YouTube/branding -OcustomName=Morphe"

[YouTube.patches]
"github:MorpheApp/morphe-patches" = []

[YouTube-Experimental]
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
patcher-args = "-e 'Change header' -Ocustom=configs/morphe/assets/YouTube/header -e 'Custom branding' -OcustomIcon=configs/morphe/assets/YouTube/branding -OcustomName=Morphe"
version = "exp"

[YouTube-Experimental.patches]
"github:MorpheApp/morphe-patches" = []

